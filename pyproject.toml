[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "theorygraph"
version = "0.1.0"
description = "Auditable extraction of value theories from pitch transcripts, and an agreement audit across models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7", "scikit-learn>=1.3", "scipy>=1.10"]

[tool.setuptools]
packages = ["theorygraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
