<svg viewBox="0 0 760 344" width="760" height="344" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="13"><title id="t">Agreement of a model with itself and with another model</title><desc id="d">Dot plot. Run again, the same model agrees closely with itself on premise counts and on grouping. Different models agree little on either.</desc><line x1="330.0" x2="330.0" y1="20" y2="306" stroke="#d5d9e0" stroke-width="1"/><text x="330.0" y="324" text-anchor="middle" fill="#55606e">0.0</text><line x1="402.0" x2="402.0" y1="20" y2="306" stroke="#d5d9e0" stroke-width="1"/><text x="402.0" y="324" text-anchor="middle" fill="#55606e">0.2</text><line x1="474.0" x2="474.0" y1="20" y2="306" stroke="#d5d9e0" stroke-width="1"/><text x="474.0" y="324" text-anchor="middle" fill="#55606e">0.4</text><line x1="546.0" x2="546.0" y1="20" y2="306" stroke="#d5d9e0" stroke-width="1"/><text x="546.0" y="324" text-anchor="middle" fill="#55606e">0.6</text><line x1="618.0" x2="618.0" y1="20" y2="306" stroke="#d5d9e0" stroke-width="1"/><text x="618.0" y="324" text-anchor="middle" fill="#55606e">0.8</text><line x1="690.0" x2="690.0" y1="20" y2="306" stroke="#d5d9e0" stroke-width="1"/><text x="690.0" y="324" text-anchor="middle" fill="#55606e">1.0</text><text x="510" y="340" text-anchor="middle" fill="#55606e">agreement (higher is better; bars are 95% bootstrap intervals over pitches)</text><text x="0" y="42" font-weight="600" fill="#1d2430">Premise count per pitch: rank correlation (Spearman)</text><text x="14" y="68.0" fill="#1d2430">Same model, run again (GPT-4o-mini, Grok 4.7)</text><circle cx="607.6" cy="64.0" r="6" fill="#009E73"/><text x="618.6" y="68.0" fill="#1d2430" font-weight="600">0.77</text><text x="14" y="98.0" fill="#1d2430">Different model, same pitches</text><circle cx="410.1" cy="94.0" r="6" fill="#D55E00"/><text x="421.1" y="98.0" fill="#1d2430" font-weight="600">0.22</text><text x="0" y="129" font-weight="600" fill="#1d2430">Grouping of the same premises: adjusted Rand index per pitch (0 = chance)</text><text x="14" y="155.0" fill="#1d2430">GPT-4o-mini, free-form domains, run again</text><line x1="626.4" x2="642.6" y1="151.0" y2="151.0" stroke="#009E73" stroke-width="2.5"/><circle cx="634.8" cy="151.0" r="6" fill="#009E73"/><text x="645.8" y="155.0" fill="#1d2430" font-weight="600">0.85</text><text x="14" y="185.0" fill="#1d2430">Grok 4.7, ten fixed labels, run again</text><line x1="581.8" x2="601.7" y1="181.0" y2="181.0" stroke="#009E73" stroke-width="2.5"/><circle cx="591.7" cy="181.0" r="6" fill="#009E73"/><text x="602.7" y="185.0" fill="#1d2430" font-weight="600">0.73</text><text x="14" y="215.0" fill="#1d2430">Grok vs Gemini, same ten labels</text><line x1="362.2" x2="379.8" y1="211.0" y2="211.0" stroke="#D55E00" stroke-width="2.5"/><circle cx="370.8" cy="211.0" r="6" fill="#D55E00"/><text x="381.8" y="215.0" fill="#1d2430" font-weight="600">0.11</text><text x="14" y="245.0" fill="#1d2430">GPT free-form vs Grok ten labels</text><line x1="399.8" x2="417.6" y1="241.0" y2="241.0" stroke="#D55E00" stroke-width="2.5"/><circle cx="408.5" cy="241.0" r="6" fill="#D55E00"/><text x="419.5" y="245.0" fill="#1d2430" font-weight="600">0.22</text><text x="14" y="275.0" fill="#1d2430">GPT free-form vs GPT three tags</text><line x1="414.6" x2="434.9" y1="271.0" y2="271.0" stroke="#D55E00" stroke-width="2.5"/><circle cx="425.3" cy="271.0" r="6" fill="#D55E00"/><text x="436.3" y="275.0" fill="#1d2430" font-weight="600">0.26</text></svg>