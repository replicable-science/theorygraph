c" stroke-width="1.6"/><path d="M712,470.0 C747,470.0 747,319.1 782,319.1" fill="none" stroke="#0072B2" stroke-opacity=".5" stroke-width="2.5"/><g><title>P1: Many Americans have subprime credit and are afraid to check their score</title><rect x="70" y="44" width="370" height="54" rx="7" fill="#fff" stroke="#5b7896" stroke-width="1.6"/><rect x="70" y="44" width="6" height="54" rx="3" fill="#5b7896"/><text x="84" y="59" font-size="11" font-weight="700" fill="#5b7896">P1</text><text x="84" y="75" font-size="12.5" fill="#1d2430">Many Americans have subprime credit and are afraid to</text><text x="84" y="90" font-size="12.5" fill="#1d2430">check their score</text></g><g><title>P2: Credit reports often contain errors that are costly</title><rect x="70" y="106" width="370" height="39" rx="7" fill="#fff" stroke="#5b7896" stroke-width="1.6"/><rect x="70" y="106" width="6" height="39" rx="3" fill="#5b7896"/><text x="84" y="121" font-size="11" font-weight="700" fill="#5b7896">P2</text><text x="84" y="137" font-size="12.5" fill="#1d2430">Credit reports often contain errors that are costly</text></g><g><title>P3: Improving credit scores is essential for financial opportunities</title><rect x="70" y="153" width="370" height="54" rx="7" fill="#fff" stroke="#5b7896" stroke-width="1.6"/><rect x="70" y="153" width="6" height="54" rx="3" fill="#5b7896"/><text x="84" y="168" font-size="11" font-weight="700" fill="#5b7896">P3</text><text x="84" y="184" font-size="12.5" fill="#1d2430">Improving credit scores is essential for financial</text><text x="84" y="199" font-size="12.5" fill="#1d2430">opportunities</text></g><g><title>P4: A structured process can help users improve their credit scores</title><rect x="70" y="229" width="370" height="54" rx="7" fill="#fff" stroke="#5b7896" stroke-width="1.6"/><rect x="70" y="229" width="6" height="54" rx="3" fill="#5b7896"/><text x="84" y="244" font-size="11" font-weight="700" fill="#5b7896">P4</text><text x="84" y="260" font-size="12.5" fill="#1d2430">A structured process can help users improve their</text><text x="84" y="275" font-size="12.5" fill="#1d2430">credit scores</text></g><g><title>P5: Behavioral economics can drive credit score improvement</title><rect x="70" y="291" width="370" height="54" rx="7" fill="#fff" stroke="#5b7896" stroke-width="1.6"/><rect x="70" y="291" width="6" height="54" rx="3" fill="#5b7896"/><text x="84" y="306" font-size="11" font-weight="700" fill="#5b7896">P5</text><text x="84" y="322" font-size="12.5" fill="#1d2430">Behavioral economics can drive credit score</text><text x="84" y="337" font-size="12.5" fill="#1d2430">improvement</text></g><g><title>P6: Unique data from users can create financial segments and personas</title><rect x="70" y="367" width="370" height="54" rx="7" fill="#fff" stroke="#5b7896" stroke-width="1.6"/><rect x="70" y="367" width="6" height="54" rx="3" fill="#5b7896"/><text x="84" y="382" font-size="11" font-weight="700" fill="#5b7896">P6</text><text x="84" y="398" font-size="12.5" fill="#1d2430">Unique data from users can create financial segments</text><text x="84" y="413" font-size="12.5" fill="#1d2430">and personas</text></g><g><title>P7: The market for financial services is large and underserved</title><rect x="70" y="443" width="370" height="54" rx="7" fill="#fff" stroke="#5b7896" stroke-width="1.6"/><rect x="70" y="443" width="6" height="54" rx="3" fill="#5b7896"/><text x="84" y="458" font-size="11" font-weight="700" fill="#5b7896">P7</text><text x="84" y="474" font-size="12.5" fill="#1d2430">The market for financial services is large and</text><text x="84" y="489" font-size="12.5" fill="#1d2430">underserved</text></g><g><title>Domain: Credit score challenges</title><rect x="530" y="102.5" width="182" height="46" rx="18" fill="#eaf3fa" stroke="#0072B2" stroke-width="1.6"/><text x="621.0" y="124.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2430">Credit score</text><text x="621.0" y="140.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2430">challenges</text></g><g><title>Domain: Credit improvement process</title><rect x="530" y="264.0" width="182" height="46" rx="18" fill="#eaf3fa" stroke="#0072B2" stroke-width="1.6"/><text x="621.0" y="286.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2430">Credit improvement</text><text x="621.0" y="302.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2430">process</text></g><g><title>Domain: User data for financial insights</title><rect x="530" y="371.0" width="182" height="46" rx="18" fill="#eaf3fa" stroke="#0072B2" stroke-width="1.6"/><text x="621.0" y="393.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2430">User data for</text><text x="621.0" y="409.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2430">financial insights</text></g><g><title>Domain: Market opportunity in financial services</title><rect x="530" y="447.0" width="182" height="46" rx="18" fill="#eaf3fa" stroke="#0072B2" stroke-width="1.6"/><text x="621.0" y="469.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2430">Market opportunity in</text><text x="621.0" y="485.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2430">financial services</text></g><g><title>Value: Americans can take control of their financial lives and improve their credit scores</title><rect x="782" y="259.1" width="170" height="120" rx="12" fill="#0b3d63"/><text x="867.0" y="279.1" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#9fc6e6">VALUE</text><text x="867.0" y="299.1" text-anchor="middle" font-size="12.5" fill="#fff">Americans can take</text><text x="867.0" y="315.1" text-anchor="middle" font-size="12.5" fill="#fff">control of their</text><text x="867.0" y="331.1" text-anchor="middle" font-size="12.5" fill="#fff">financial lives and</text><text x="867.0" y="347.1" text-anchor="middle" font-size="12.5" fill="#fff">improve their credit</tex